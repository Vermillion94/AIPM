[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aipm"
version = "0.1.0"
description = "AI Project Manager — autonomous engineering workforce for GitHub projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "anthropic>=0.49",
    "python-telegram-bot>=22.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.1",
    "gitpython>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
aipm = "aipm.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/aipm"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
