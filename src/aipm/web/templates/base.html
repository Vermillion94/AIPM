<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AIPM Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        @keyframes pulse-green { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .pulse-green { animation: pulse-green 2s ease-in-out infinite; }
        .status-backlog { color: #94a3b8; }
        .status-queued { color: #facc15; }
        .status-in_progress { color: #3b82f6; }
        .status-in_review { color: #a855f7; }
        .status-done { color: #22c55e; }
        .status-failed { color: #ef4444; }
        .status-needs_human { color: #f97316; }
    </style>
</head>
<body class="h-full text-gray-200">
    <nav class="bg-gray-900 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <span class="text-xl font-bold text-white">AIPM</span>
                <span class="text-sm text-gray-400">AI Project Manager</span>
            </a>
            <div class="flex items-center gap-6 text-sm">
                <a href="/" class="text-gray-300 hover:text-white">Dashboard</a>
                <span id="live-indicator" class="flex items-center gap-1 text-green-400">
                    <span class="w-2 h-2 bg-green-400 rounded-full pulse-green"></span>
                    Live
                </span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="max-w-7xl mx-auto px-4 py-4 mt-8 border-t border-gray-800 text-xs text-gray-500">
        AIPM v0.1.0 — Autonomous AI Engineering Workforce
    </footer>
</body>
</html>
